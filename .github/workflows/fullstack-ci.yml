name: Fullstack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: reservation-system-backend/pom.xml

      - name: Build Backend with Maven
        working-directory: ./reservation-system-backend
        run: ./mvnw clean package -DskipTests

      - name: Create dummy .env file for Docker Compose
        run: |
          echo "DB_USER=test_user" >> .env
          echo "DB_PASSWORD=test_pass" >> .env

      - name: Build Docker images
        run: docker compose build